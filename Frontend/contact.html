<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | XGM Wellness</title>

    <meta name="description"
        content="Get in touch with XGM Wellness. Questions about products, orders or becoming a reseller — we'd love to hear from you.">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/pages.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div id="site-header"></div>

<section class="page-banner">
    <div class="page-banner-content">
        <span>We're Here To Help</span>
        <h1>Get In Touch</h1>
        <p>Have questions about our products or reseller programme? We'd love to hear from you.</p>
    </div>
</section>

<section class="contact-section">

    <div class="contact-info-cards reveal-stagger">
        <div class="contact-info-card">
            <div class="icon-circle"><i class="fa-solid fa-phone"></i></div>
            <h3>Call Us</h3>
            <p>+27 71 123 4567</p>
        </div>
        <div class="contact-info-card">
            <div class="icon-circle"><i class="fa-solid fa-envelope"></i></div>
            <h3>Email Us</h3>
            <p>info@xgmwellness.co.za</p>
        </div>
        <div class="contact-info-card">
            <div class="icon-circle"><i class="fa-solid fa-location-dot"></i></div>
            <h3>Visit Us</h3>
            <p>Cape Town, South Africa</p>
        </div>
        <div class="contact-info-card">
            <div class="icon-circle"><i class="fa-brands fa-whatsapp"></i></div>
            <h3>WhatsApp</h3>
            <p>Chat with our team</p>
        </div>
    </div>

    <div class="contact-form-wrap reveal-fade">
        <h2>Send Us a Message</h2>
        <form class="contact-form">
            <div class="form-row">
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email Address" required>
            </div>
            <input type="text" placeholder="Subject" required>
            <textarea placeholder="Your Message" rows="5" required></textarea>
            <button type="submit" class="primary-btn">Send Message <i class="fa-solid fa-arrow-right"></i></button>
        </form>
    </div>

</section>

<div id="site-footer"></div>

<!--==================== SCRIPTS ====================-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="database/supabase.js"></script>
<script src="assets/js/script.js"></script>
<script src="assets/js/include.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/auth.js"></script>

</body>

</html>
