<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | XGM Wellness</title>

    <meta name="description"
        content="Shop premium wellness and beauty products at XGM Wellness. Skincare, health, supplements and more, delivered nationwide across South Africa.">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/pages.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"

<body>

<div id="site-header"></div>

<!--==================== PAGE HEADER ====================-->
<section class="page-banner">
    <div class="page-banner-content">
        <span>Shop</span>

        <p>Browse our full range of wellness and beauty products.</p>
    </div>
</section>

<!--==================== SHOP ====================-->
<section class="shop-section">

    <div class="filter-tabs">
    <button class="filter-tab active" data-category="all">All</button>
    <button class="filter-tab" data-category="WELLNESS AND BEAUTY">Wellness & Beauty</button>
    <button class="filter-tab" data-category="HERBAL TEAS">Herbal Teas</button>
    <button class="filter-tab" data-category="HERBAL JUICES">Herbal Juices</button>
    <button class="filter-tab" data-category="HERBAL CAPSULES">Herbal Capsules</button>

    <button class="filter-tab" data-category="LOVE AND RELATIONSHIPS">Love & Relationships</button>
    <button class="filter-tab" data-category="PROSPERITY">Prosperity</button>
</div>

    <div id="products-grid" class="product-grid">
        <p class="products-loading">Loading products…</p>
    </div>

</section>

<div id="site-footer"></div>

<!--==================== SCRIPTS ====================-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
